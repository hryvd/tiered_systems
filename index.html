<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tiered Systems • Opportunity OS</title>
  <meta name="description" content="Interactive satellite radar map and liquid-glass Opportunity OS of verified Memorandum of Agreement (MOA) industry partner companies for BatStateU Alangilan." />
  <meta property="og:title" content="Tiered Systems • Opportunity OS" />
  <meta property="og:description" content="Explore verified MOA industry partners across Batangas, Calabarzon, and Metro Manila on a live liquid-glass satellite map." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#09090b" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- Google Fonts: Inter & Geist Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Shared Design Tokens & Opportunity OS Stylesheet -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/os.css" />
  <script>
    (function () {
      try {
        var raw = sessionStorage.getItem("ts_os_launch_morph");
        if (!raw) return;
        var data = JSON.parse(raw);
        if (!data || Date.now() - data.ts > 6000) {
          sessionStorage.removeItem("ts_os_launch_morph");
          return;
        }
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          sessionStorage.removeItem("ts_os_launch_morph");
          return;
        }
        document.documentElement.classList.add("os-launch-entering");
        window.setTimeout(function () {
          document.documentElement.classList.remove("os-launch-entering");
        }, 4500);
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#os-search-input">Skip to partner search</a>

  <!-- Full-Bleed Live Map Canvas -->
  <div id="opportunity-map" role="region" aria-label="Interactive satellite map of verified MOA partner companies"></div>
  <div class="map-vignette" aria-hidden="true"></div>

  <!-- Non-blocking Floating Status Toast -->
  <div class="os-status-toast" id="os-status-toast" role="status" aria-live="polite" hidden>
    <span class="status-pulse" aria-hidden="true"></span>
    <span id="os-status-text">Live directory ready</span>
    <button type="button" class="os-toast-dismiss" id="os-status-dismiss" aria-label="Dismiss notification">&times;</button>
  </div>

  <!-- Floating Liquid-Glass HUD -->
  <div
    class="os-hud"
    id="os-hud"
    data-rail-collapsed="false"
    data-drawer-open="false"
    data-inspector-open="true"
    data-mobile-sheet="peek"
  >
    <!-- Top Search Pill & Category Chips -->
    <header class="os-top-cluster">
      <div class="os-search-pill glass-surface" role="search">
        <a href="./program.html" class="os-brand-badge" title="Tiered Systems 4-Tier Program Guide" aria-label="Tiered Systems 4-Tier Program Guide">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <ellipse cx="12" cy="12" rx="9" ry="4" />
            <ellipse cx="12" cy="12" rx="4" ry="9" />
          </svg>
        </a>

        <label for="os-search-input" class="visually-hidden">Search verified MOA partners</label>
        <span class="os-search-label" aria-hidden="true">SEARCH</span>

        <input
          type="search"
          id="os-search-input"
          class="os-search-input"
          placeholder="Companies, Batangas hubs, CpE/ECE, MOA ref…"
          autocomplete="off"
          spellcheck="false"
        />

        <button type="button" class="os-search-clear" id="os-search-clear" aria-label="Clear search" hidden>&times;</button>

        <span class="os-result-pill num" id="os-result-pill" aria-live="polite">— MOAs</span>

        <a href="./program.html" class="os-program-link" title="View the 4-Tier Readiness Program & Schedule">
          <span>4 Tiers</span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 11L11 5M6 5h5v5" /></svg>
        </a>
      </div>

      <!-- Category Filter Pills (ALL · SOFTWARE · HARDWARE · AI / ML · ENERGY) -->
      <div class="os-cat-row" id="os-cat-row" role="group" aria-label="Sector category filter">
        <button type="button" class="os-cat-pill glass-pill active" data-cat="ALL">ALL</button>
        <button type="button" class="os-cat-pill glass-pill" data-cat="SOFTWARE">SOFTWARE</button>
        <button type="button" class="os-cat-pill glass-pill" data-cat="HARDWARE">HARDWARE</button>
        <button type="button" class="os-cat-pill glass-pill" data-cat="AI / ML">AI / ML</button>
        <button type="button" class="os-cat-pill glass-pill" data-cat="ENERGY">ENERGY</button>
      </div>
    </header>

    <!-- Left Floating Navigation Rail (Desktop / Tablet) -->
    <nav class="os-nav-rail glass-surface" id="os-nav-rail" aria-label="Opportunity OS modules">
      <div class="os-rail-group">
        <button type="button" class="os-nav-btn" data-panel="distance" title="Campus distance &amp; discipline filters">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="3" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2" /></svg>
          <span>DISTANCE</span>
        </button>
        <button type="button" class="os-nav-btn" data-panel="catalog" title="Browse full MOA partner catalog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5" /><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5" /><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5" /><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5" /></svg>
          <span>CATALOG</span>
        </button>
        <button type="button" class="os-nav-btn" data-panel="ai" title="AI Partner Matcher">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z" /><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z" /></svg>
          <span>AI AGENT</span>
        </button>
      </div>

      <div class="os-rail-divider" aria-hidden="true"></div>

      <div class="os-rail-group">
        <button type="button" class="os-nav-btn" data-panel="inventory" title="Capacity analytics, shortlist &amp; CSV export">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19v-4" /></svg>
          <span>INVENTORY</span>
        </button>
        <button type="button" class="os-nav-btn" data-panel="profile" title="Student profile &amp; 4-Tier readiness tracker">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M5 20a7 7 0 0114 0" /></svg>
          <span>PROFILE</span>
        </button>
      </div>

      <button type="button" class="os-rail-collapse-btn" id="btn-toggle-rail" aria-label="Collapse or expand navigation rail" title="Collapse navigation rail">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" /></svg>
      </button>
    </nav>

    <!-- Floating Contextual Tool Drawer -->
    <section class="os-drawer glass-surface" id="os-drawer" aria-label="Active workspace tool" hidden>
      <header class="os-drawer-head">
        <div class="os-sheet-grabber" aria-hidden="true"></div>
        <div class="os-drawer-title-row">
          <div>
            <h2 id="os-drawer-title">Tool Panel</h2>
            <p id="os-drawer-subtitle" class="os-drawer-sub">Configure Opportunity OS</p>
          </div>
          <button type="button" class="os-icon-btn" id="btn-drawer-close" aria-label="Close panel">&times;</button>
        </div>
      </header>
      <div class="os-drawer-body" id="os-drawer-body"></div>
    </section>

    <!-- Right Floating Liquid-Glass Partner Inspector -->
    <aside class="os-inspector glass-surface" id="os-inspector" aria-label="Selected partner details">
      <!-- Mobile Compact Peek Bar (visible on <= 768px when peeked) -->
      <div class="os-inspector-peek" id="os-inspector-peek"></div>

      <div class="os-sheet-grabber os-inspector-grabber" id="os-inspector-grabber" aria-hidden="true"></div>

      <div class="os-inspector-topbar">
        <span class="os-verified-chip" id="os-inspector-status">
          <span class="dot" aria-hidden="true"></span>
          <span>Active MOA</span>
        </span>
        <div class="os-inspector-topbar-actions">
          <button type="button" class="os-icon-btn" id="btn-inspector-bookmark" aria-label="Save partner to shortlist" title="Save to shortlist">☆</button>
          <button type="button" class="os-icon-btn" id="btn-inspector-toggle" aria-label="Minimize partner inspector" title="Minimize inspector">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
          </button>
        </div>
      </div>

      <div class="os-inspector-scroll" id="os-inspector-content">
        <!-- Populated dynamically by js/os-app.js -->
      </div>

      <div class="os-insp-actions" id="os-inspector-actions"></div>
    </aside>

    <!-- Reopen Inspector Floating Pill (when minimized on desktop or hidden on mobile) -->
    <button type="button" class="os-inspector-reopen glass-pill" id="os-inspector-reopen" hidden>
      <span class="dot" aria-hidden="true"></span>
      <span id="os-reopen-label">Partner Details</span>
    </button>

    <!-- Bottom-Left Floating Map Controls & Layers Switcher -->
    <div class="os-bottom-left">
      <div class="os-layers-wrap" id="os-layers-control">
        <button
          type="button"
          class="os-layers-tile glass-surface"
          id="btn-layers-toggle"
          aria-expanded="false"
          aria-controls="os-layers-menu"
          title="Switch map basemap style"
        >
          <span class="os-layers-preview is-satellite" id="os-layers-preview" aria-hidden="true">
            <span class="layers-grid-mesh"></span>
          </span>
          <span class="os-layers-caption">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2L2 5.5 8 9l6-3.5L8 2zM2 8.5L8 12l6-3.5M2 11.5L8 15l6-3.5" /></svg>
            <span>Layers</span>
          </span>
        </button>

        <div class="os-layers-menu glass-surface" id="os-layers-menu" role="menu" aria-label="Map styles" hidden>
          <button type="button" class="os-layer-opt active" data-style="satellite" role="menuitemradio" aria-checked="true">
            <span class="layer-swatch swatch-sat" aria-hidden="true"></span>
            <span>Satellite</span>
          </button>
          <button type="button" class="os-layer-opt" data-style="dark" role="menuitemradio" aria-checked="false">
            <span class="layer-swatch swatch-dark" aria-hidden="true"></span>
            <span>Obsidian</span>
          </button>
          <button type="button" class="os-layer-opt" data-style="street" role="menuitemradio" aria-checked="false">
            <span class="layer-swatch swatch-street" aria-hidden="true"></span>
            <span>Street</span>
          </button>
        </div>
      </div>

      <div class="os-map-utils glass-pill" role="toolbar" aria-label="Map camera controls">
        <button type="button" class="os-util-btn" id="btn-jump-campus" title="Fly to BatStateU campus origin">Campus</button>
        <button type="button" class="os-util-btn" id="btn-fit-bounds" title="Fit all filtered partner pins">Fit all</button>
        <span class="os-util-sep" aria-hidden="true"></span>
        <button type="button" class="os-util-btn icon-only" id="btn-zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
        <button type="button" class="os-util-btn icon-only" id="btn-zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
      </div>
    </div>

    <!-- Mobile Bottom Liquid-Glass Dock (<= 768px) -->
    <nav class="os-mobile-dock glass-surface" id="os-mobile-dock" aria-label="Mobile Opportunity OS tools">
      <button type="button" class="os-dock-btn" data-panel="distance">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="3" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2" /></svg>
        <span>Distance</span>
      </button>
      <button type="button" class="os-dock-btn" data-panel="catalog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5" /><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5" /><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5" /><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5" /></svg>
        <span>Catalog</span>
      </button>
      <button type="button" class="os-dock-btn" data-panel="ai">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z" /></svg>
        <span>AI Agent</span>
      </button>
      <button type="button" class="os-dock-btn" data-panel="inventory">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19v-4" /></svg>
        <span>Stats</span>
      </button>
      <button type="button" class="os-dock-btn" data-panel="profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M5 20a7 7 0 0114 0" /></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="./js/os-app.js"></script>
</body>
</html>
